<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620">
  <rect width="1160" height="620" fill="#FFFFFF"/>

  <text x="580" y="46" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#2D3748">Offline Organization, per Question Type</text>
  <text x="580" y="70" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#718096">LongMemEval-S, paired per-question flips · GPT-4o-mini judge · McNemar net +47, p ≈ 7.7e-6 (qwen3.7-max: net +50, p ≈ 1.3e-6)</text>

  <!-- 坐标轴 0.55 - 1.00 -->
  <g font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#718096">
    <line x1="300" y1="540" x2="1000" y2="540" stroke="#4A5568" stroke-width="1.8"/>
    <text x="300" y="560" text-anchor="middle">0.55</text>
    <text x="456" y="560" text-anchor="middle">0.65</text>
    <text x="611" y="560" text-anchor="middle">0.75</text>
    <text x="767" y="560" text-anchor="middle">0.85</text>
    <text x="922" y="560" text-anchor="middle">0.95</text>
    <text x="650" y="590" text-anchor="middle" font-size="12">accuracy</text>
  </g>
  <!-- x = 300 + (acc-0.55)/0.45*700 -->

  <g font-family="Helvetica,Arial,sans-serif">
    <!-- KU: 0.692→0.859 -->
    <text x="290" y="135" text-anchor="end" font-size="12" fill="#2D3748">knowledge-update</text>
    <line x1="521" y1="130" x2="781" y2="130" stroke="#2D9D78" stroke-width="3"/>
    <circle cx="521" cy="130" r="7" fill="#9AA7B5"/><circle cx="781" cy="130" r="7" fill="#2D9D78"/>
    <text x="521" y="112" text-anchor="middle" font-size="11" fill="#718096">0.692</text>
    <text x="781" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#2D9D78">0.859</text>
    <text x="808" y="158" font-size="12" font-weight="bold" fill="#2D9D78">+13 flips · zero reverse</text>

    <!-- MS: 0.579→0.699 -->
    <text x="290" y="205" text-anchor="end" font-size="12" fill="#2D3748">multi-session</text>
    <line x1="345" y1="200" x2="532" y2="200" stroke="#2D9D78" stroke-width="3"/>
    <circle cx="345" cy="200" r="7" fill="#9AA7B5"/><circle cx="532" cy="200" r="7" fill="#2D9D78"/>
    <text x="345" y="182" text-anchor="middle" font-size="11" fill="#718096">0.579</text>
    <text x="532" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#2D9D78">0.699</text>
    <text x="559" y="228" font-size="12" font-weight="bold" fill="#2D9D78">+16 flips</text>

    <!-- temporal: 0.602→0.707 -->
    <text x="290" y="275" text-anchor="end" font-size="12" fill="#2D3748">temporal-reasoning</text>
    <line x1="381" y1="270" x2="544" y2="270" stroke="#2D9D78" stroke-width="3"/>
    <circle cx="381" cy="270" r="7" fill="#9AA7B5"/><circle cx="544" cy="270" r="7" fill="#2D9D78"/>
    <text x="381" y="252" text-anchor="middle" font-size="11" fill="#718096">0.602</text>
    <text x="544" y="252" text-anchor="middle" font-size="11" font-weight="bold" fill="#2D9D78">0.707</text>
    <text x="571" y="298" font-size="12" font-weight="bold" fill="#2D9D78">+14 flips</text>

    <!-- SS-user: 0.900→0.986 -->
    <text x="290" y="345" text-anchor="end" font-size="12" fill="#2D3748">single-session-user</text>
    <line x1="844" y1="340" x2="978" y2="340" stroke="#2D9D78" stroke-width="3"/>
    <circle cx="844" cy="340" r="7" fill="#9AA7B5"/><circle cx="978" cy="340" r="7" fill="#2D9D78"/>
    <text x="844" y="322" text-anchor="middle" font-size="11" fill="#718096">0.900</text>
    <text x="978" y="322" text-anchor="middle" font-size="11" font-weight="bold" fill="#2D9D78">0.986</text>
    <text x="844" y="365" font-size="12" font-weight="bold" fill="#2D9D78">+6 flips</text>

    <!-- SS-asst: 0.982→0.946 -->
    <text x="290" y="415" text-anchor="end" font-size="12" fill="#718096">single-session-assistant</text>
    <line x1="972" y1="410" x2="916" y2="410" stroke="#B0BAC6" stroke-width="3"/>
    <circle cx="972" cy="410" r="7" fill="#9AA7B5"/><circle cx="916" cy="410" r="7" fill="#B0BAC6"/>
    <text x="986" y="392" text-anchor="middle" font-size="11" fill="#9AA7B5">0.982</text>
    <text x="902" y="432" text-anchor="middle" font-size="11" fill="#9AA7B5">0.946</text>
    <text x="852" y="415" text-anchor="end" font-size="11" fill="#9AA7B5">−2 · near ceiling</text>

    <!-- SS-pref: 0.900→0.900 -->
    <text x="290" y="485" text-anchor="end" font-size="12" fill="#718096">single-session-preference</text>
    <line x1="838" y1="480" x2="850" y2="480" stroke="#B0BAC6" stroke-width="3"/>
    <circle cx="844" cy="480" r="7" fill="#9AA7B5"/><circle cx="844" cy="480" r="4" fill="#B0BAC6"/>
    <text x="844" y="462" text-anchor="middle" font-size="11" fill="#9AA7B5">0.900</text>
    <text x="800" y="485" text-anchor="end" font-size="11" fill="#9AA7B5">±0 · flat</text>
  </g>

  <!-- 机制连线 -->
  <g font-family="Helvetica,Arial,sans-serif">
    <text x="1136" y="104" text-anchor="end" font-size="13" font-weight="bold" fill="#C25E14">supersede</text>
    <line x1="790" y1="128" x2="1136" y2="118" stroke="#C25E14" stroke-width="1.4" stroke-dasharray="4,3"/>
    <text x="1136" y="178" text-anchor="end" font-size="13" font-weight="bold" fill="#C25E14">associative graph</text>
    <line x1="541" y1="198" x2="1136" y2="192" stroke="#C25E14" stroke-width="1.4" stroke-dasharray="4,3"/>
    <text x="1136" y="256" text-anchor="end" font-size="13" font-weight="bold" fill="#C25E14">event-time structure</text>
    <line x1="553" y1="269" x2="1136" y2="270" stroke="#C25E14" stroke-width="1.4" stroke-dasharray="4,3"/>
  </g>
</svg>
