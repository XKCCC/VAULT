<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7A8F"/>
    </marker>
    <marker id="arrOrange2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E8762B"/>
    </marker>
  </defs>

  <rect width="1280" height="700" fill="#FFFFFF"/>

  <text x="640" y="44" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#2D3748">Offline Restructuring Pass</text>
  <text x="640" y="68" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#718096">one merged LLM call per memory item · zero online overhead</text>

  <!-- 输入卡片堆 -->
  <g>
    <rect x="40" y="160" width="90" height="56" rx="4" fill="#FFFFFF" stroke="#9AA7B5" stroke-width="1.5"/>
    <rect x="47" y="167" width="90" height="56" rx="4" fill="#FFFFFF" stroke="#9AA7B5" stroke-width="1.5"/>
    <rect x="54" y="174" width="90" height="56" rx="4" fill="#FFFFFF" stroke="#6B7A8F" stroke-width="1.8"/>
    <text x="99" y="198" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#4A5568">raw</text>
    <text x="99" y="213" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9AA7B5">memories</text>
  </g>
  <line x1="150" y1="200" x2="196" y2="200" stroke="#6B7A8F" stroke-width="1.8" marker-end="url(#arr2)"/>

  <!-- 五站 -->
  <!-- ① 结构化 -->
  <rect x="200" y="120" width="190" height="160" rx="10" fill="#EDF3FA" stroke="#7C9CC4" stroke-width="2"/>
  <text x="295" y="150" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#2B4C7E">1. Structuring</text>
  <rect x="222" y="166" width="100" height="62" rx="4" fill="#FFFFFF" stroke="#8B98A8" stroke-width="1.3"/>
  <line x1="232" y1="180" x2="312" y2="180" stroke="#C6D0DB" stroke-width="3"/>
  <line x1="232" y1="192" x2="312" y2="192" stroke="#C6D0DB" stroke-width="3"/>
  <line x1="232" y1="204" x2="290" y2="204" stroke="#C6D0DB" stroke-width="3"/>
  <rect x="328" y="168" width="52" height="18" rx="9" fill="#DCE9F7" stroke="#7C9CC4" stroke-width="1"/>
  <text x="354" y="181" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#2B4C7E">label1</text>
  <rect x="328" y="192" width="52" height="18" rx="9" fill="#DCE9F7" stroke="#7C9CC4" stroke-width="1"/>
  <text x="354" y="205" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#2B4C7E">label2</text>
  <text x="295" y="252" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6B87AC">summary + facts + labels</text>

  <!-- ② 关联建边 -->
  <rect x="420" y="120" width="190" height="160" rx="10" fill="#EDF3FA" stroke="#7C9CC4" stroke-width="2"/>
  <text x="515" y="150" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#2B4C7E">2. Linking</text>
  <circle cx="515" cy="195" r="7" fill="#4A72A8"/>
  <circle cx="478" cy="176" r="5.5" fill="#E8762B"/><circle cx="556" cy="176" r="5.5" fill="#E8762B"/>
  <circle cx="482" cy="222" r="5.5" fill="#E8762B"/><circle cx="552" cy="222" r="5.5" fill="#9AA7B5"/>
  <line x1="515" y1="195" x2="478" y2="176" stroke="#E8762B" stroke-width="2.2"/>
  <line x1="515" y1="195" x2="556" y2="176" stroke="#E8762B" stroke-width="2.2"/>
  <line x1="515" y1="195" x2="482" y2="222" stroke="#E8762B" stroke-width="2.2"/>
  <line x1="515" y1="195" x2="552" y2="222" stroke="#9AA7B5" stroke-width="1.6" stroke-dasharray="4,3"/>
  <line x1="545" y1="216" x2="559" y2="228" stroke="#C25E14" stroke-width="2"/>
  <line x1="559" y1="216" x2="545" y2="228" stroke="#C25E14" stroke-width="2"/>
  <text x="515" y="252" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6B87AC">similarity proposes, judgment disposes</text>

  <!-- ③ supersede -->
  <rect x="640" y="120" width="190" height="160" rx="10" fill="#FFF4EA" stroke="#E8762B" stroke-width="2.2"/>
  <text x="735" y="150" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#C25E14">3. Supersede</text>
  <rect x="660" y="164" width="150" height="34" rx="4" fill="#F2F4F6" stroke="#9AA7B5" stroke-width="1.3"/>
  <text x="735" y="186" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8B98A8">interval: 7 months</text>
  <rect x="716" y="156" width="86" height="20" rx="3" fill="none" stroke="#C25E14" stroke-width="2" transform="rotate(-8 759 166)"/>
  <text x="759" y="171" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" fill="#C25E14" transform="rotate(-8 759 166)">superseded</text>
  <rect x="660" y="212" width="150" height="34" rx="4" fill="#FFFFFF" stroke="#E8762B" stroke-width="2"/>
  <text x="728" y="234" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#2D3748">3 months 20 days</text>
  <path d="M788,226 L792,231 L800,222" fill="none" stroke="#2D9D78" stroke-width="2.4"/>
  <line x1="700" y1="203" x2="700" y2="212" stroke="#E8762B" stroke-width="2" marker-end="url(#arrOrange2)"/>
  <text x="735" y="268" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#C98A54">filtered at retrieval, not deleted</text>

  <!-- ④ 主题融合 -->
  <rect x="860" y="120" width="190" height="160" rx="10" fill="#EDF3FA" stroke="#7C9CC4" stroke-width="2"/>
  <text x="955" y="150" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" fill="#2B4C7E">4. Fusion (L3)</text>
  <rect x="878" y="168" width="34" height="24" rx="3" fill="#FFFFFF" stroke="#8B98A8" stroke-width="1.2"/>
  <rect x="878" y="198" width="34" height="24" rx="3" fill="#FFFFFF" stroke="#8B98A8" stroke-width="1.2"/>
  <rect x="878" y="228" width="34" height="24" rx="3" fill="#FFFFFF" stroke="#8B98A8" stroke-width="1.2"/>
  <line x1="912" y1="180" x2="940" y2="195" stroke="#7C9CC4" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="912" y1="210" x2="940" y2="205" stroke="#7C9CC4" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="912" y1="240" x2="940" y2="215" stroke="#7C9CC4" stroke-width="1.5" marker-end="url(#arr2)"/>
  <rect x="944" y="180" width="92" height="52" rx="6" fill="#2B4C7E"/>
  <text x="990" y="202" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">insight card</text>
  <text x="990" y="219" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#BCD0E8">theme / habit</text>
  <text x="955" y="268" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6B87AC">background card, not evidence</text>

  <!-- 输出 -->
  <rect x="1080" y="140" width="150" height="120" rx="10" fill="#F5F6F7" stroke="#4A5568" stroke-width="2.4"/>
  <text x="1155" y="176" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#2D3748">restructured</text>
  <text x="1155" y="196" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#2D3748">index</text>
  <text x="1155" y="226" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#718096">entries + graph</text>
  <text x="1155" y="242" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#718096">+ versions + L3</text>

  <line x1="390" y1="200" x2="412" y2="200" stroke="#6B7A8F" stroke-width="1.8" marker-end="url(#arr2)"/>
  <line x1="610" y1="200" x2="632" y2="200" stroke="#6B7A8F" stroke-width="1.8" marker-end="url(#arr2)"/>
  <line x1="830" y1="200" x2="852" y2="200" stroke="#6B7A8F" stroke-width="1.8" marker-end="url(#arr2)"/>
  <line x1="1050" y1="200" x2="1072" y2="200" stroke="#6B7A8F" stroke-width="1.8" marker-end="url(#arr2)"/>

  <!-- 底部案例放大条 -->
  <rect x="60" y="330" width="1160" height="310" rx="12" fill="#FBF7EF" stroke="#D8CBAF" stroke-width="1.5"/>
  <text x="90" y="368" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" fill="#7A6844">example: what the pass does to real traces</text>

  <!-- 时间线 -->
  <line x1="130" y1="470" x2="1150" y2="470" stroke="#C9BDA3" stroke-width="2"/>
  <line x1="250" y1="464" x2="250" y2="476" stroke="#C9BDA3" stroke-width="2"/>
  <line x1="700" y1="464" x2="700" y2="476" stroke="#C9BDA3" stroke-width="2"/>

  <rect x="150" y="400" width="200" height="52" rx="6" fill="#FFFFFF" stroke="#8B98A8" stroke-width="1.5"/>
  <text x="250" y="422" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#4A5568">2025-03 · physical exam</text>
  <text x="250" y="440" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#C25E14">marker A abnormal (6.2)</text>

  <rect x="600" y="400" width="200" height="52" rx="6" fill="#FFFFFF" stroke="#E8762B" stroke-width="2"/>
  <text x="700" y="422" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#4A5568">2025-06 · recheck</text>
  <text x="700" y="440" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#2D9D78">back to normal</text>

  <line x1="350" y1="426" x2="592" y2="426" stroke="#E8762B" stroke-width="2.6" marker-end="url(#arrOrange2)"/>
  <text x="471" y="414" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#C25E14">supersede</text>

  <rect x="380" y="520" width="220" height="52" rx="6" fill="#FFFFFF" stroke="#8B98A8" stroke-width="1.5"/>
  <text x="490" y="542" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#4A5568">2025-03-13 · chat</text>
  <text x="490" y="560" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#4A5568">doctor advised lighter diet</text>
  <line x1="250" y1="452" x2="430" y2="520" stroke="#E8762B" stroke-width="2.2" marker-end="url(#arrOrange2)"/>
  <text x="300" y="500" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" fill="#C25E14">associative edge</text>

  <text x="1150" y="620" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#9AA7B5">answers to "how is the marker now?" read the 2025-06 version only</text>
</svg>
